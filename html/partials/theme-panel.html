<!-- Theme panel -->
<div class="theme-panel" id="themePanel">
  <div class="tp-label">Choose your theme</div>
  <div class="tp-swatches">
    <div class="tp-swatch active" data-t="ocean"  onclick="setAppTheme('ocean',this)"><div class="tp-swatch-dot"></div><div class="tp-swatch-name">Ocean</div></div>
    <div class="tp-swatch"        data-t="candy"  onclick="setAppTheme('candy',this)"><div class="tp-swatch-dot"></div><div class="tp-swatch-name">Candy</div></div>
    <div class="tp-swatch"        data-t="sunset" onclick="setAppTheme('sunset',this)"><div class="tp-swatch-dot"></div><div class="tp-swatch-name">Sunset</div></div>
    <div class="tp-swatch"        data-t="violet" onclick="setAppTheme('violet',this)"><div class="tp-swatch-dot"></div><div class="tp-swatch-name">Violet</div></div>
    <div class="tp-swatch"        data-t="forest" onclick="setAppTheme('forest',this)"><div class="tp-swatch-dot"></div><div class="tp-swatch-name">Forest</div></div>
  </div>
</div>
