<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme options — SAMO Passport</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Nunito', system-ui, -apple-system, sans-serif; margin: 0; padding: 28px;
         background: #f4f6f9; color: #1c2733; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #667; margin: 0 0 24px; font-size: 14px; }
  h2 { font-size: 16px; margin: 28px 0 12px; text-transform: uppercase; letter-spacing: .6px; color: #44505c; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.06);
          border: 2px solid transparent; }
  .card.current { border-color: #cbd5e1; }
  .card h3 { margin: 0 0 2px; font-size: 17px; }
  .tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
         color: #8a97a5; margin-bottom: 12px; display: block; }
  .swatches { display: flex; gap: 0; border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .sw { flex: 1; height: 46px; display: flex; align-items: flex-end; justify-content: center;
        font-size: 9px; color: rgba(255,255,255,.9); font-weight: 700; padding-bottom: 3px; }
  .sw.light { color: rgba(0,0,0,.45); }
  /* mini UI mock */
  .mock { border-radius: 12px; padding: 14px; }
  .mock .title { font-weight: 800; font-size: 15px; margin-bottom: 8px; }
  .mock .btn { display: inline-block; color: #fff; font-weight: 800; font-size: 13px;
               padding: 9px 16px; border-radius: 12px; margin-right: 8px; }
  .mock .chip { display: inline-block; font-weight: 700; font-size: 12px; padding: 4px 11px;
                border-radius: 20px; }
  .mock .bar { height: 8px; border-radius: 99px; margin-top: 12px; overflow: hidden; }
  .mock .fill { height: 100%; width: 62%; border-radius: 99px; }
  .hexrow { font-family: ui-monospace, monospace; font-size: 11px; color: #5a6672; margin-top: 10px; }
</style>
</head>
<body>
<h1>🎨 Theme options</h1>
<p class="sub">Real rendered colors. Tell me which you want for each — e.g. “Forest → Ocean, Violet → Lavender, Sunset → a little.”</p>

<div id="root"></div>

<script>
const THEMES = {
  'OCEAN → options': [
    { name: 'Current Ocean', tag:'current', pri:'#2d6a8a', priM:'#5898b8', priS:'#d8eef8', sec:'#48a89e', secM:'#78c8c0', secS:'#d8f4f2' },
    { name: 'Deep Sea',  pri:'#1d5273', priM:'#4a82a4', priS:'#d6e6f0', sec:'#2f8a86', secM:'#5fb0aa', secS:'#d6f0ee' },
    { name: 'Teal',      pri:'#1f8189', priM:'#54b0b6', priS:'#d6f1f3', sec:'#2f9aa0', secM:'#62c0c4', secS:'#d8f4f5' },
    { name: 'Azure',     pri:'#2a6fc0', priM:'#6296dc', priS:'#dde8f8', sec:'#3aa0d4', secM:'#6cc0e6', secS:'#ddf0fa' },
    { name: 'Lagoon',    pri:'#1f8a8f', priM:'#56b8bc', priS:'#d8f4f4', sec:'#3aa884', secM:'#6cc4a4', secS:'#daf2e6' },
    { name: 'Petrol',    pri:'#1f6470', priM:'#4f96a0', priS:'#d8ecef', sec:'#2a8a78', secM:'#5cb4a2', secS:'#d8f1ea' },
    { name: 'Sky',       pri:'#3f8fc0', priM:'#74b2dc', priS:'#ddeef8', sec:'#4fb0c8', secM:'#80ccdd', secS:'#ddf2f6' },
  ],
  'CANDY → options': [
    { name: 'Current Candy', tag:'current', pri:'#6D9FD5', priM:'#9abfe8', priS:'#ddeef8', sec:'#c4a8c0', secM:'#d8c0d4', secS:'#EEDEEC' },
    { name: 'Cotton',    pri:'#7aa6dd', priM:'#a4c4ec', priS:'#e0eef9', sec:'#cc9ec8', secM:'#ddbcda', secS:'#f3e6f1' },
    { name: 'Bubblegum', pri:'#e58cae', priM:'#efb0c8', priS:'#fde6ee', sec:'#8aa6e4', secM:'#b0c2ee', secS:'#e6ecfb' },
    { name: 'Sky Candy', pri:'#72b2e2', priM:'#a0cdee', priS:'#e0f1fb', sec:'#aebfe8', secM:'#c8d4f0', secS:'#ebeffb' },
    { name: 'Mint Candy', pri:'#6cc2b2', priM:'#9adacd', priS:'#ddf4ef', sec:'#b6d8c2', secM:'#cee6d6', secS:'#ecf6ef' },
    { name: 'Lilac',     pri:'#a48ad8', priM:'#c2afe6', priS:'#ece6f9', sec:'#cc9ad4', secM:'#ddb8e2', secS:'#f4e7f6' },
  ],
  'FOREST → navy / black': [
    { name: 'Current Forest', tag: 'current', pri:'#28888a', priM:'#58b8ba', priS:'#d8f4f2', sec:'#2a6e4a', secM:'#58a87a', secS:'#d8f0e4' },
    { name: 'Navy',      pri:'#1f3a68', priM:'#5070a8', priS:'#dde4f0', sec:'#3060a0', secM:'#6a92c8', secS:'#e0eaf6' },
    { name: 'Midnight',  pri:'#16223f', priM:'#3c5080', priS:'#d9dee8', sec:'#2f4068', secM:'#6276a0', secS:'#dee3ee' },
    { name: 'Onyx',      pri:'#1c2530', priM:'#46525e', priS:'#dde1e6', sec:'#394a5c', secM:'#66788c', secS:'#e2e7ec' },
    { name: 'Navy Gold', pri:'#1f3a68', priM:'#5070a8', priS:'#dde4f0', sec:'#c79a3a', secM:'#ddb968', secS:'#f7eccf' },
    { name: 'Slate Steel', pri:'#2a3f54', priM:'#566c84', priS:'#dee4ea', sec:'#4a7a9a', secM:'#7aa6c6', secS:'#e2eef4' },
  ],
  'VIOLET → options': [
    { name: 'Current Violet', tag:'current', pri:'#2a4a8a', priM:'#6888cc', priS:'#dde8fa', sec:'#6a5acc', secM:'#9a8ae0', secS:'#eceafa' },
    { name: 'Royal',     pri:'#5b3fb0', priM:'#8870d4', priS:'#e6e0f7', sec:'#7d52c8', secM:'#a285dd', secS:'#ece4f8' },
    { name: 'Amethyst',  pri:'#7a3fb8', priM:'#a575d6', priS:'#ece0f6', sec:'#9a52cc', secM:'#bc88dd', secS:'#f1e4f8' },
    { name: 'Mauve',     pri:'#7c6a98', priM:'#a193ba', priS:'#ece8f1', sec:'#9a7ca0', secM:'#bca0c0', secS:'#f1e8f2' },
    { name: 'Iris',      pri:'#5448c0', priM:'#847add', priS:'#e4e2f8', sec:'#7560d8', secM:'#a08fe6', secS:'#eae6fb' },
    { name: 'Aubergine', pri:'#5a2f5e', priM:'#8a5a8e', priS:'#ecdcec', sec:'#7a3a6a', secM:'#a86a96', secS:'#f3e0ec' },
    { name: 'Heather',   pri:'#9070c0', priM:'#b49ad8', priS:'#efe8f8', sec:'#b088c8', secM:'#cba8db', secS:'#f5ecf8' },
  ],
  'SUNSET → options': [
    { name: 'Current Sunset', tag:'current', pri:'#d4607a', priM:'#e898aa', priS:'#fde8ef', sec:'#d4a830', secM:'#e8c858', secS:'#fef4d0' },
    { name: 'A little lighter', pri:'#df7488', priM:'#ea9aaa', priS:'#fdebf0', sec:'#e0b94a', secM:'#ecce70', secS:'#fef6d8' },
    { name: 'Noticeably lighter', pri:'#ea8fa0', priM:'#f2b0bd', priS:'#fdeef2', sec:'#eccb68', secM:'#f2dc90', secS:'#fef8e0' },
    { name: 'Coral',     pri:'#e07258', priM:'#ee9d88', priS:'#fde7df', sec:'#e0a838', secM:'#edc66a', secS:'#fdf1d2' },
    { name: 'Peach',     pri:'#e58a6a', priM:'#f0ad96', priS:'#fdece4', sec:'#e6b85a', secM:'#f0d088', secS:'#fdf3da' },
    { name: 'Tangerine', pri:'#e8743a', priM:'#f2a070', priS:'#fde8da', sec:'#e0a830', secM:'#edc862', secS:'#fdf2cf' },
    { name: 'Rosé',      pri:'#d96a8a', priM:'#e89aaf', priS:'#fde9ef', sec:'#c08ac0', secM:'#d6b0d6', secS:'#f4e9f4' },
  ],
};

function isLight(hex){ const n=parseInt(hex.slice(1),16); const r=n>>16,g=(n>>8)&255,b=n&255;
  return (0.299*r+0.587*g+0.114*b) > 150; }

const root = document.getElementById('root');
for (const [group, list] of Object.entries(THEMES)) {
  const h = document.createElement('h2'); h.textContent = group; root.appendChild(h);
  const grid = document.createElement('div'); grid.className='grid';
  list.forEach(t => {
    const cur = t.tag === 'current';
    const sws = [['pri',t.pri],['pri-m',t.priM],['pri-s',t.priS],['sec',t.sec],['sec-m',t.secM],['sec-s',t.secS]]
      .map(([k,c]) => `<div class="sw ${isLight(c)?'light':''}" style="background:${c}">${k}</div>`).join('');
    grid.insertAdjacentHTML('beforeend', `
      <div class="card ${cur?'current':''}">
        <h3>${t.name}</h3>
        <span class="tag">${cur?'current — for comparison':'option'}</span>
        <div class="swatches">${sws}</div>
        <div class="mock" style="background:${t.priS}">
          <div class="title" style="color:${t.pri}">My Passport</div>
          <span class="btn" style="background:linear-gradient(135deg, ${t.pri}, ${t.sec})">Save ✓</span>
          <span class="chip" style="background:${t.secS}; color:${t.sec}">+250 km</span>
          <div class="bar" style="background:${t.priS}; box-shadow:inset 0 0 0 1px ${t.priM}55">
            <div class="fill" style="background:linear-gradient(90deg, ${t.pri}, ${t.priM})"></div>
          </div>
        </div>
        <div class="hexrow">pri ${t.pri} · sec ${t.sec}</div>
      </div>`);
  });
  root.appendChild(grid);
}
</script>
</body>
</html>
