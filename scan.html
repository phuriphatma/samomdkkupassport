<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stamping Passport...</title>
    <link rel="stylesheet" href="css/main.css" />
    <style>
      .scan-container {
        text-align: center;
        margin-top: 100px;
      }
      /* A simple spinning animation for loading */
      .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border-left-color: var(--accent-blue);
        animation: spin 1s linear infinite;
        margin: 0 auto 20px auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .success {
        color: var(--accent-green);
      }
      .error {
        color: var(--accent-red);
      }
    </style>
  </head>
  <body>
    <div class="container scan-container">
      <div id="loading-spinner">
        <div class="spinner"></div>
        <h2>Verifying Flight Data...</h2>
        <p>Please wait while we check your passport.</p>
      </div>

      <h1 id="scan-title"></h1>
      <p id="scan-message"></p>

      <div id="action-buttons" style="display: none; margin-top: 30px">
        <button
          onclick="window.location.href = 'dashboard.html'"
          class="btn-large"
        >
          View My Passport
        </button>
      </div>
    </div>

    <script type="module">
      import { processScan } from "./js/scanning.js";

      // Run the scan processor as soon as the page loads
      processScan();
    </script>
  </body>
</html>
