<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samo Passport Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/main.css">
</head>

<body class="landing">
    <div class="landing-layout">

        <!-- Left Branding Panel -->
        <div class="landing-left">
            <div class="landing-brand">
                <h1>Life is a Journey ✈️</h1>
                <p class="brand-subtitle">Medical Student wellness<br>passport system.</p>
            </div>

            <div class="landing-deco">
                <div class="landing-deco-emoji">🎒</div>
                <div class="landing-deco-compass">🧭 &nbsp; 📍 &nbsp; 🗺️</div>
            </div>

            <div class="landing-user-section">
                <p id="loading-text" style="color: #92694A; font-weight: 600; margin: 0 0 16px;">Reading device cache...</p>

                <button id="google-login" style="display: none;">Login with @kkumail.com</button>

                <div id="logged-in-section" style="display: none;">
                    <div class="welcome-card">
                        <p>Welcome back!</p>
                        <h3 id="user-email-display"></h3>
                    </div>

                    <button id="continue-btn" style="margin-bottom: 12px;">Board Your Flight</button>

                    <div class="landing-links">
                        <a href="#" id="logout-btn" class="text-link sign-out-link">Sign Out</a>
                    </div>
                </div>

                <div style="margin-top: 18px;">
                    <a href="/html/admin.html" class="text-link admin-link">Admin Portal</a>
                </div>
            </div>
        </div>

        <!-- Right Decorative Panel -->
        <div class="landing-right">
            <div class="landing-right-content">
                <div class="route-card">
                    <div class="route-card-title">Wellness Journey</div>
                    <div class="route-points">
                        <div class="route-point">
                            <div class="route-dot origin"></div>
                            <div>
                                <span class="route-label">Departure</span>
                                <span class="route-value">Year 1</span>
                            </div>
                        </div>
                        <div class="route-point">
                            <div class="route-dot connector"></div>
                        </div>
                        <div class="route-point">
                            <div class="route-dot" style="background: #F59E0B;"></div>
                            <div>
                                <span class="route-label">Milestone</span>
                                <span class="route-value">Wellness 2027 ✈️</span>
                            </div>
                        </div>
                        <div class="route-point">
                            <div class="route-dot connector" style="background: linear-gradient(to bottom, #F59E0B, #0EA5E9); opacity: 0.4;"></div>
                        </div>
                        <div class="route-point">
                            <div class="route-dot dest"></div>
                            <div>
                                <span class="route-label">Destination</span>
                                <span class="route-value">The Explorer 🏆</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="/js/index.js"></script>
</body>

</html>
