<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samo Passport Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>

<body class="landing">
    <div class="terminal-container">
        <h1>Life is a Journey ✈️</h1>
        <p>Medical Student wellness passport system.</p>

        <p id="loading-text" style="color: var(--accent-primary); font-weight: 600; margin: 20px 0;">Reading device
            cache...</p>

        <button id="google-login" class="btn-large" style="display: none;">Login with @kkumail.com</button>

        <div id="logged-in-section" style="display: none; margin-top: 20px;">
            <div
                style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--glass-border);">
                <p style="margin-bottom: 5px; font-size: 0.9rem; color: var(--text-muted);">Welcome back!</p>
                <h3 id="user-email-display" style="margin: 0; color: var(--accent-primary); word-break: break-all;">
                </h3>
            </div>

            <button id="continue-btn" class="btn-large" style="margin-bottom: 15px;">Continue to My Passport</button>
            <a href="#" id="logout-btn" class="text-link"
                style="color: var(--accent-danger); font-weight: bold; display: inline-block; margin-top: 10px;">Sign
                Out of this Device</a>
        </div>

        <div style="margin-top: 25px;">
            <a href="admin.html" class="text-link">Admin Portal</a>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/app.js';

        const loadingText = document.getElementById('loading-text');
        const loginBtn = document.getElementById('google-login');
        const loggedInSection = document.getElementById('logged-in-section');
        const emailDisplay = document.getElementById('user-email-display');

        function updateUI(session) {
            loadingText.style.display = 'none';

            if (session && session.user) {
                loggedInSection.style.display = 'block';
                loginBtn.style.display = 'none';
                emailDisplay.innerText = session.user.email;
            } else {
                loggedInSection.style.display = 'none';
                loginBtn.style.display = 'block';
            }
        }

        async function initAuth() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) throw error;
                updateUI(session);
            } catch (err) {
                console.error("Session check error:", err);
                updateUI(null);
            }

            supabase.auth.onAuthStateChange((_event, session) => {
                updateUI(session);
            });
        }

        document.getElementById('google-login').addEventListener('click', async () => {
            loadingText.style.display = 'block';
            loadingText.innerText = 'Redirecting to Google...';
            loginBtn.style.display = 'none';

            // FIX: If we have a pending scan URL, pass it to Google so we land right back on the scan!
            let redirectUrl = window.location.origin + '/dashboard.html';
            let pendingUrl = null;
            try {
                pendingUrl = localStorage.getItem('pendingScanUrl');
            } catch (e) {
                console.warn("Could not read localStorage", e);
            }

            if (pendingUrl) {
                redirectUrl = pendingUrl;
            }

            await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: redirectUrl,
                }
            });
        });

        document.getElementById('continue-btn').addEventListener('click', () => {
            // FIX: Changed sessionStorage to localStorage
            let pendingUrl = null;
            try {
                pendingUrl = localStorage.getItem('pendingScanUrl');
                if (pendingUrl) {
                    localStorage.removeItem('pendingScanUrl');
                }
            } catch (e) {
                console.warn("Could not read/write localStorage", e);
            }
            
            if (pendingUrl) {
                window.location.href = pendingUrl;
            } else {
                window.location.href = 'dashboard.html';
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            loadingText.style.display = 'block';
            loadingText.innerText = 'Clearing device cache...';
            loggedInSection.style.display = 'none';

            try {
                await supabase.auth.signOut();
            } catch (err) {
                console.error("Logout error:", err);
            }
            window.location.reload();
        });

        initAuth();
    </script>
</body>

</html>
