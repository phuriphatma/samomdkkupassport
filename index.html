<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samo Passport Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/main.css">
</head>

<body class="landing">

    <!-- Floating clouds -->
    <div class="sky-bg">
        <div class="sky-cloud cloud-1"></div>
        <div class="sky-cloud cloud-2"></div>
        <div class="sky-cloud cloud-3"></div>
        <div class="sky-cloud cloud-4"></div>
        <div class="sky-cloud cloud-5"></div>
        <div class="sky-cloud cloud-6"></div>
    </div>

    <div class="landing-wrap">

        <!-- Hero: brand + floating passport preview -->
        <div class="landing-hero">
            <div class="landing-deco-character">🧳</div>
            <div class="landing-brand">
                <h1>Life is a Journey ✈️</h1>
                <p class="brand-subtitle">Medical Student wellness passport system.</p>
            </div>
            <div class="passport-preview-wrap">
                <div class="passport-preview-book">
                    <div class="preview-emblem">🌏</div>
                    <div class="preview-divider"></div>
                    <div class="preview-title">SAMO<br>PASSPORT</div>
                    <div class="preview-subtitle">WELLNESS 2027</div>
                </div>
            </div>
        </div>

        <!-- Login card -->
        <div class="landing-card">
            <p id="loading-text">Reading device cache...</p>

            <button id="google-login" style="display:none;">Login with @kkumail.com</button>

            <div id="logged-in-section" style="display:none;">
                <div class="welcome-card">
                    <p>Welcome back!</p>
                    <h3 id="user-email-display"></h3>
                </div>
                <button id="continue-btn" style="margin-bottom:10px;">Board Your Flight ✈️</button>
                <div class="landing-links">
                    <a href="#" id="logout-btn" class="text-link sign-out-link">Sign Out</a>
                </div>
            </div>

            <a href="/html/admin.html" class="text-link admin-link">Admin Portal</a>
        </div>

    </div>

    <script type="module" src="/js/index.js"></script>
</body>
</html>
